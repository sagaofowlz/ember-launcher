<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<title>Ember Launcher</title>
<style>
:root{color-scheme:dark;--bg:#0c0f0d;--panel:#141915;--panel2:#1b211c;--line:#293329;--muted:#899489;--text:#eef4ec;--lime:#c3f36b;--lime2:#96cb45;--danger:#ff8f7b;--radius:19px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:radial-gradient(ellipse at 80% -20%,rgba(195,243,107,.09),transparent 45%),var(--bg);position:relative}.top{padding:calc(15px + env(safe-area-inset-top)) 19px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.045);flex-shrink:0}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:var(--lime);display:grid;place-items:center;color:#162010;font-weight:950;letter-spacing:-2px;box-shadow:0 5px 22px rgba(195,243,107,.14);font-size:17px}.brandname{font-size:16px;letter-spacing:.2px;font-weight:800}.subbrand{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:1.7px;text-transform:uppercase}.profilechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#141914;padding:8px 10px;border-radius:999px;max-width:48%}.avatar{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#293522;color:var(--lime);font-size:12px;font-weight:800;flex-shrink:0}.chiptext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650}.statusdot{width:6px;height:6px;border-radius:50%;background:#edbb5a;flex-shrink:0}.main{overflow:auto;flex:1;padding:17px 16px calc(20px + env(safe-area-inset-bottom));scrollbar-width:thin;scrollbar-color:#384136 transparent}.main::-webkit-scrollbar{width:4px}.main::-webkit-scrollbar-thumb{background:#384136;border-radius:9px}.eyebrow{font-size:10px;letter-spacing:1.65px;font-weight:800;text-transform:uppercase;color:var(--lime)}h1,h2,h3,p{margin-top:0}h1{font-size:29px;line-height:1.08;letter-spacing:-1px;margin:8px 0 9px}h2{font-size:18px;letter-spacing:-.3px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px}p{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:0}.hero{border:1px solid #36442f;background:linear-gradient(125deg,#1d291a 0%,#151b15 52%,#151a16 100%);border-radius:24px;padding:22px;position:relative;overflow:hidden;margin:3px 0 17px}.hero:after{content:"";position:absolute;right:-32px;top:-28px;width:190px;height:190px;border-radius:50%;border:1px solid rgba(195,243,107,.17);box-shadow:0 0 0 20px rgba(195,243,107,.025),0 0 0 42px rgba(195,243,107,.02)}.hero:before{content:"✳";position:absolute;right:25px;top:37px;font-size:105px;color:rgba(195,243,107,.12);transform:rotate(12deg);font-weight:200}.hero>*{position:relative;z-index:1}.hero h1{max-width:310px}.hero p{max-width:360px}.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(195,243,107,.1);color:var(--lime);border:1px solid rgba(195,243,107,.2);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:7px 10px;border-radius:999px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}.primary,.secondary,.quiet,.dangerbtn{min-height:43px;border-radius:12px;border:0;padding:0 15px;font-size:12px;font-weight:800;transition:transform .14s ease,opacity .14s ease}.primary{background:var(--lime);color:#172110}.primary:active,.secondary:active,.quiet:active{transform:scale(.98)}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{border:1px solid #3c4a37;background:#222d20;color:var(--lime)}.quiet{background:#202620;color:#dce6d8;border:1px solid var(--line)}.dangerbtn{background:#3a211e;color:#ffb5a8;border:1px solid #61352d}.heroactions{display:flex;gap:9px;margin-top:19px;flex-wrap:wrap}.notice{background:#181e17;border:1px solid #333f2e;color:#aab7a3;border-radius:12px;padding:11px 13px;font-size:11px;line-height:1.5}.notice strong{color:#edf5e9}.notice.warn{border-color:#4d3e24;background:#241e13;color:#d8c49b}.notice.good{border-color:#344a2a;background:#182218;color:#c3dfb3}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:22px 1px 11px}.sectionhead .mini{font-size:10px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile,.card{background:linear-gradient(145deg,#171d18,#121713);border:1px solid var(--line);border-radius:17px;padding:15px;min-width:0}.tileicon{width:34px;height:34px;display:grid;place-items:center;background:#253020;color:var(--lime);border-radius:11px;font-size:16px;margin-bottom:13px}.tile p{font-size:11px}.tile .value{font-size:19px;font-weight:850;letter-spacing:-.5px;margin-bottom:5px}.nav{display:flex;align-items:stretch;justify-content:space-around;background:rgba(15,19,15,.97);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));flex-shrink:0;backdrop-filter:blur(16px)}.navbutton{min-width:0;flex:1;background:transparent;color:#687468;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 2px;font-size:9px;font-weight:750}.navbutton .ico{width:28px;height:26px;display:grid;place-items:center;border-radius:9px;font-size:17px}.navbutton.active{color:var(--lime)}.navbutton.active .ico{background:#293420}.pageintro{margin:2px 1px 18px}.pageintro h1{font-size:26px}.pageintro p{max-width:520px}.fieldlabel{display:block;font-size:10px;letter-spacing:1px;font-weight:800;color:#a8b3a4;text-transform:uppercase;margin:14px 0 7px}.field,input,select{width:100%;min-height:44px;border-radius:11px;background:#0e120f;color:var(--text);border:1px solid #303a30;padding:0 12px;font-size:13px}.field:focus,input:focus,select:focus{border-color:#83a950;outline:none}.rowfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.providerhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}.providerlogo{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:#20291e;border:1px solid #36432e;font-weight:900;color:var(--lime);font-size:15px}.providerhead p{font-size:11px}.stack{display:grid;gap:12px}.catalogbar{display:flex;gap:8px;margin:14px 0 10px}.catalogbar input{flex:1;min-width:0}.catalogbar button{flex-shrink:0}.resultlist{display:grid;gap:10px}.result{display:grid;grid-template-columns:43px minmax(0,1fr);gap:11px;background:#141a15;border:1px solid var(--line);border-radius:15px;padding:12px}.resulticon{width:43px;height:43px;border-radius:11px;background:#242f22;object-fit:cover;display:grid;place-items:center;color:var(--lime);font-weight:900}.resultbody{min-width:0}.resulttitle{font-size:13px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-bottom:4px}.resultdesc{font-size:11px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.resultfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.downloadcount{font-size:10px;color:#879486}.resultfoot button{min-height:33px;padding:0 11px;border-radius:9px;font-size:10px}.empty{border:1px dashed #354033;border-radius:15px;text-align:center;padding:28px 15px;color:var(--muted);font-size:12px;line-height:1.6}.emptyicon{font-size:27px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:11px}.separator{height:1px;background:var(--line);margin:16px 0}.controlstage{border:1px solid #34402f;background:radial-gradient(circle at 50% 50%,#202b1e,#121712 70%);border-radius:19px;min-height:248px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:18px;overflow:hidden}.dpad{display:grid;grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px);gap:4px}.padbtn{background:#283127;border:1px solid #43513d;border-radius:9px;color:#c8d4c0;font-size:13px;font-weight:800}.padbtn.spacer{visibility:hidden}.rightcontrols{display:flex;align-items:center;gap:8px;transform:rotate(-8deg)}.actionkey{width:46px;height:46px;border-radius:50%;background:#2b3823;border:1px solid #66874b;color:var(--lime);font-weight:900}.actionkey.alt{width:38px;height:38px;background:#222a22;color:#e3eadf;border-color:#495348}.stagecenter{font-size:9px;line-height:1.5;color:#70816b;text-align:center;letter-spacing:1px;text-transform:uppercase;max-width:70px}.sliderline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:15px 0}.sliderline label{font-size:12px;color:#c4d0c0}.sliderline input{width:45%;min-height:20px;padding:0;accent-color:var(--lime)}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.settingrow:last-child{border-bottom:0}.settingcopy strong{font-size:12px;display:block}.settingcopy span{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:4px}.settingrow select{width:138px;min-height:38px;font-size:11px}.modalback{position:fixed;inset:0;z-index:50;background:rgba(2,5,3,.82);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:22px}.modal{width:100%;max-width:420px;border:1px solid #3a4934;border-radius:22px;background:#151b16;padding:21px;box-shadow:0 25px 100px #0009}.modal h2{font-size:20px}.codebox{font-size:26px;letter-spacing:4px;font-weight:900;color:var(--lime);background:#0b100c;border:1px dashed #43583b;border-radius:12px;padding:18px 10px;text-align:center;margin:14px 0}.toast{position:absolute;z-index:70;left:16px;right:16px;bottom:calc(85px + env(safe-area-inset-bottom));padding:12px 14px;border:1px solid #43533d;border-radius:13px;background:#1c271a;color:#eaf3e4;font-size:12px;line-height:1.45;box-shadow:0 8px 28px #0008;animation:slide .18s ease}.toast.error{border-color:#713e35;background:#2b1c19;color:#ffc0b4}@keyframes slide{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.footer-note{text-align:center;color:#526052;font-size:9px;letter-spacing:.4px;margin:21px 0 5px}.progressline{height:3px;border-radius:5px;background:#283126;overflow:hidden;margin-top:10px}.progressline i{display:block;width:38%;height:100%;background:var(--lime);animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(160%)}}.skeleton{height:9px;background:#263026;border-radius:6px;margin-top:8px}
@media(min-width:600px){.main{padding:22px 24px 28px}.top{padding-left:25px;padding-right:25px}.hero{padding:28px}.nav{padding-left:17px;padding-right:17px}.navbutton{font-size:10px}.grid.wide{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){h1{font-size:25px}.hero{padding:17px}.hero:before{right:0;font-size:85px}.main{padding-left:12px;padding-right:12px}.navbutton{font-size:8px}.controlstage{gap:6px;padding:10px}.dpad{grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px)}.actionkey{width:38px;height:38px}.actionkey.alt{width:32px;height:32px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">E/</div><div><div class="brandname">EMBER</div><div class="subbrand">Java launcher</div></div></div>
    <button class="profilechip" data-action="go-accounts" aria-label="Manage account"><span class="avatar" id="headerAvatar">?</span><span class="chiptext" id="headerName">No profile</span><span class="statusdot"></span></button>
  </header>
  <main class="main" id="main"></main>
  <nav class="nav" aria-label="Main navigation">
    <button class="navbutton active" data-tab="home"><span class="ico">⌂</span><span>Home</span></button>
    <button class="navbutton" data-tab="mods"><span class="ico">▦</span><span>Mods</span></button>
    <button class="navbutton" data-tab="shaders"><span class="ico">✧</span><span>Shaders</span></button>
    <button class="navbutton" data-tab="controls"><span class="ico">⊞</span><span>Controls</span></button>
    <button class="navbutton" data-tab="accounts"><span class="ico">◉</span><span>Accounts</span></button>
  </nav>
  <div id="toastHost" aria-live="polite"></div>
  <div id="modalHost"></div>
</div>
<script>
(() => {
  'use strict';
  const $ = (s, root=document) => root.querySelector(s);
  const state = {
    tab:'home', profile:null, settings:{mcVersion:'1.21.1',loader:'fabric',memory:'2048',touchScale:'100',msClientId:''},
    catalog:{mod:{results:[],loading:false,query:''},shader:{results:[],loading:false,query:''}},
    authBusy:false, downloadBusy:false, library:{mods:0,shaders:0}, touchScale:100
  };
  const safe = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const human = n => Number(n||0).toLocaleString();
  const native = () => !!(window.Ember && typeof Ember.getStartupData === 'function');
  function toast(message, error=false){
    const host=$('#toastHost');host.innerHTML=`<div class="toast ${error?'error':''}">${safe(message)}</div>`;
    clearTimeout(toast.timer);toast.timer=setTimeout(()=>host.innerHTML='',4200);
  }
  function persist(key,value){state.settings[key]=String(value);if(native())Ember.saveSetting(key,String(value));}
  function updateProfile(profile){state.profile=profile||null;const name=profile?.name||'No profile';$('#headerName').textContent=name;$('#headerAvatar').textContent=name==='No profile'?'?':name.slice(0,1).toUpperCase();}
  function setTab(tab){state.tab=tab;document.querySelectorAll('.navbutton').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();$('.main').scrollTop=0;}
  function pageIntro(eyebrow,title,desc){return `<div class="pageintro"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>`;}
  function profileLine(){if(!state.profile)return `<div class="notice warn"><strong>No account selected.</strong> Choose Offline for a local profile, or connect a supported account. Online Minecraft servers require a valid licensed account.</div>`;return `<div class="card" style="display:flex;align-items:center;gap:12px"><div class="avatar" style="width:42px;height:42px;font-size:17px">${safe(state.profile.name.slice(0,1).toUpperCase())}</div><div style="flex:1;min-width:0"><h3 style="margin-bottom:4px">${safe(state.profile.name)}</h3><p>${safe(state.profile.provider||'Offline')} profile · ${safe((state.profile.uuid||'').slice(0,8))}…</p></div><span class="pill">Selected</span></div>`;}
  function renderHome(){return `
    <section class="hero"><span class="pill"><span class="dot"></span> BUILT FOR JAVA</span><h1>Your next world<br>starts here.</h1><p>One home for mod discovery, shader packs and your Minecraft profiles. Made for Android touchscreens.</p><div class="heroactions"><button class="primary" data-action="play" disabled>▶ &nbsp; Play Minecraft</button><button class="secondary" data-tab="mods">Explore mods ↗</button></div></section>
    <div class="notice warn"><strong>Runtime status · Not connected</strong><br>This MVP includes the launcher shell, account flows and Modrinth library manager. The Java game runtime/rendering engine is a separate integration, so Play is disabled for now.</div>
    <div class="sectionhead"><div><div class="eyebrow">YOUR PROFILE</div><h2 style="margin-top:6px">Ready when you are</h2></div><button class="quiet" data-tab="accounts">Manage ↗</button></div>
    ${profileLine()}
    <div class="sectionhead"><div><div class="eyebrow">TOOLKIT</div><h2 style="margin-top:6px">Your launcher hub</h2></div><span class="mini">v${safe(state.version||'0.1.0')}</span></div>
    <div class="grid wide">
      <button class="tile" data-tab="mods" style="text-align:left;color:inherit"><div class="tileicon">▦</div><div class="value">${human(state.library.mods)}</div><h3>Mod library</h3><p>Browse Modrinth and save .jar files locally.</p></button>
      <button class="tile" data-tab="shaders" style="text-align:left;color:inherit"><div class="tileicon">✧</div><div class="value">${human(state.library.shaders)}</div><h3>Shader packs</h3><p>Find shader .zip packs compatible with your setup.</p></button>
      <button class="tile" data-tab="controls" style="text-align:left;color:inherit"><div class="tileicon">⊞</div><div class="value">Touch UI</div><h3>Control layout</h3><p>Preview a mobile-friendly control arrangement.</p></button>
    </div>
    <div class="sectionhead"><div><div class="eyebrow">QUICK SETUP</div><h2 style="margin-top:6px">Make it yours</h2></div></div>
    <div class="card"><div class="settingrow"><div class="settingcopy"><strong>Minecraft version</strong><span>Filters mod and shader search results</span></div><select id="quickVersion" data-setting="mcVersion">${versionOptions()}</select></div><div class="settingrow"><div class="settingcopy"><strong>Mod loader</strong><span>Fabric, Forge, NeoForge or Quilt</span></div><select data-setting="loader"><option value="fabric" ${sel('loader','fabric')}>Fabric</option><option value="forge" ${sel('loader','forge')}>Forge</option><option value="neoforge" ${sel('loader','neoforge')}>NeoForge</option><option value="quilt" ${sel('loader','quilt')}>Quilt</option></select></div><div class="formactions"><button class="primary" data-action="save-quick">Save preferences</button><button class="quiet" data-tab="settings">More settings</button></div></div>
    <div class="footer-note">EMBER IS AN INDEPENDENT COMMUNITY PROJECT · NOT AFFILIATED WITH MOJANG OR MICROSOFT</div>`;}
  function versionOptions(){return ['1.21.8','1.21.5','1.21.1','1.21','1.20.6','1.20.4','1.20.1','1.19.2','1.18.2','1.16.5'].map(v=>`<option value="${v}" ${state.settings.mcVersion===v?'selected':''}>${v}</option>`).join('');}
  function sel(k,v){return String(state.settings[k]||'')===String(v)?'selected':'';}
  function renderCatalog(kind){const isShader=kind==='shader';const cfg=state.catalog[kind];const title=isShader?'Shader gallery':'Modrinth mods';const phrase=isShader?'shader packs':'mods';let list='';
    if(cfg.loading) list=`<div class="empty"><div class="emptyicon">◌</div>Searching Modrinth…<div class="progressline"><i></i></div></div>`;
    else if(cfg.results.length) list=`<div class="resultlist">${cfg.results.map(p=>`<article class="result"><div>${p.icon?`<img class="resulticon" src="${safe(p.icon)}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<div class="resulticon">${isShader?'✧':'▦'}</div>`}</div><div class="resultbody"><div class="resulttitle">${safe(p.title)}</div><div class="resultdesc">${safe(p.description||'No description provided.')}</div><div class="resultfoot"><span class="downloadcount">↓ ${human(p.downloads)} downloads</span><button class="primary" data-action="install" data-id="${safe(p.id)}" data-kind="${kind}" ${state.downloadBusy?'disabled':''}>Download</button></div></div></article>`).join('')}</div>`;
    else list=`<div class="empty"><div class="emptyicon">${isShader?'✧':'▦'}</div><strong>No results loaded yet</strong><br>Search Modrinth for ${phrase}. Files will be saved into Ember's private library on this device.</div>`;
    return `${pageIntro(isShader?'VISUALS / MODRINTH':'CONTENT / MODRINTH',title,isShader?'Discover shader packs. Actual rendering depends on a compatible Minecraft runtime and renderer.':'Find mods from Modrinth, filtered by Minecraft version and loader.')}
      <div class="card"><div class="rowfields"><div><label class="fieldlabel" for="catalogVersion">Minecraft version</label><select id="catalogVersion" data-setting="mcVersion">${versionOptions()}</select></div>${!isShader?`<div><label class="fieldlabel" for="catalogLoader">Loader</label><select id="catalogLoader" data-setting="loader"><option value="fabric" ${sel('loader','fabric')}>Fabric</option><option value="forge" ${sel('loader','forge')}>Forge</option><option value="neoforge" ${sel('loader','neoforge')}>NeoForge</option><option value="quilt" ${sel('loader','quilt')}>Quilt</option></select></div>`:''}</div><form class="catalogbar" data-form="search" data-kind="${kind}"><input id="catalogQuery" name="query" value="${safe(cfg.query)}" maxlength="100" placeholder="Search ${isShader?'shader packs':'mods'}…"><button class="primary" type="submit">Search</button></form><p class="small">Source: Modrinth API · Downloads are filtered for the selected game version${isShader?'':' and loader'}.</p></div>
      <div class="sectionhead"><div><div class="eyebrow">DISCOVER</div><h2 style="margin-top:6px">${safe(cfg.query||'Popular '+phrase)}</h2></div><span class="mini">${cfg.results.length} results</span></div>
      <div id="catalogList">${list}</div>
      <div class="notice" style="margin-top:14px"><strong>Before installing:</strong> these files are saved in Ember's app-private library. They are not injected into a running game because the Minecraft runtime is not bundled in this build.</div>`;}
  function renderAccounts(){return `${pageIntro('IDENTITY / ACCOUNTS','Choose your player','Keep account tokens out of local storage. Ember saves profile display data only; credentials are sent directly to the selected identity service over HTTPS.')}
    <div class="stack">
      <section class="card"><div class="providerhead"><div class="providerlogo">MS</div><div><h2>Microsoft account</h2><p>Java Edition ownership verification</p></div></div><p>Uses the device-code flow. You need a Client ID from your own Microsoft Entra app registration configured for public-client/device-code and Xbox Live sign-in. No client secret belongs in this app.</p><label class="fieldlabel" for="msClientId">Application (client) ID</label><input id="msClientId" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" value="${safe(state.settings.msClientId||'')}"><div class="formactions"><button class="quiet" data-action="open-ms-docs">Setup guide ↗</button><button class="primary" data-action="microsoft-login" ${state.authBusy?'disabled':''}>Continue with Microsoft</button></div><p class="small" style="margin-top:10px">Ember will verify Xbox, Minecraft entitlement and profile before marking the account connected.</p></section>
      <section class="card"><div class="providerhead"><div class="providerlogo">E</div><div><h2>Ely.by</h2><p>Alternative Minecraft authentication</p></div></div><p>Sign in through Ely.by's documented Minecraft authentication endpoint. Your password is submitted directly to Ely.by via HTTPS and is not saved by Ember.</p><label class="fieldlabel" for="elyUsername">Username or email</label><input id="elyUsername" autocomplete="username" placeholder="Ely.by username or email"><label class="fieldlabel" for="elyPassword">Password</label><input id="elyPassword" type="password" autocomplete="current-password" placeholder="Password"><div class="formactions"><button class="primary" data-action="ely-login" ${state.authBusy?'disabled':''}>Sign in to Ely.by</button><button class="quiet" data-action="open-ely-docs">Auth docs ↗</button></div></section>
      <section class="card"><div class="providerhead"><div class="providerlogo">OF</div><div><h2>Offline profile</h2><p>Local coding / single-player profile</p></div></div><p>No account or network authentication. Offline usernames do not prove ownership and generally cannot join authenticated online servers.</p><label class="fieldlabel" for="offlineName">Player name</label><input id="offlineName" maxlength="16" autocomplete="off" placeholder="YourPlayerName" value="${state.profile?.provider==='Offline'?safe(state.profile.name):''}"><div class="formactions"><button class="primary" data-action="offline-login">Use Offline profile</button></div></section>
    </div>
    <div class="sectionhead"><div><div class="eyebrow">CURRENT SELECTION</div><h2 style="margin-top:6px">Active profile</h2></div></div>${profileLine()}
    <div class="notice warn" style="margin-top:12px">Tokens and passwords aren't persisted by this MVP. Account sign-in proves identity only; launching Minecraft still requires integration of the Java runtime.</div>`;}
  function renderControls(){return `${pageIntro('INPUT / MOBILE','Touch controls','A preview of a configurable HUD idea. The buttons are not connected to Minecraft until the runtime/input bridge is integrated.')}
    <div class="controlstage"><div class="dpad"><button class="padbtn spacer"> </button><button class="padbtn" data-action="preview-key">▲</button><button class="padbtn spacer"> </button><button class="padbtn" data-action="preview-key">◀</button><button class="padbtn" data-action="preview-key">●</button><button class="padbtn" data-action="preview-key">▶</button><button class="padbtn spacer"> </button><button class="padbtn" data-action="preview-key">▼</button><button class="padbtn spacer"> </button></div><div class="stagecenter">HUD<br>PREVIEW<br>NOT IN-GAME</div><div class="rightcontrols"><button class="actionkey alt" data-action="preview-key">⤺</button><button class="actionkey" data-action="preview-key">A</button><button class="actionkey" data-action="preview-key">B</button></div></div>
    <section class="card" style="margin-top:13px"><div class="sectionhead" style="margin-top:0"><div><div class="eyebrow">LAYOUT</div><h2 style="margin-top:6px">Button sizing</h2></div><span class="pill" id="scaleDisplay">${safe(state.settings.touchScale||'100')}%</span></div><div class="sliderline"><label for="touchScale">HUD scale</label><input id="touchScale" type="range" min="70" max="140" step="5" value="${safe(state.settings.touchScale||'100')}" data-setting="touchScale"></div><div class="separator"></div><div class="settingrow"><div class="settingcopy"><strong>Left-hand movement</strong><span>Movement pad on the left side</span></div><span class="pill">Preview</span></div><div class="settingrow"><div class="settingcopy"><strong>Right-hand actions</strong><span>Jump / interact on the right side</span></div><span class="pill">Preview</span></div><div class="formactions"><button class="primary" data-action="save-touch">Save layout preference</button></div></section>
    <div class="notice" style="margin-top:13px">For actual gameplay, touch events must be mapped into the Java/GLFW input layer of a Minecraft runtime. Saving this value currently stores the preference only.</div>`;}
  function renderSettings(){return `${pageIntro('PREFERENCES / DEVICE','Launcher settings','These preferences currently affect discovery and launcher UI. Runtime-only settings will be applied when a game engine is integrated.')}
    <section class="card"><div class="settingrow"><div class="settingcopy"><strong>Minecraft version</strong><span>Used for Modrinth compatibility filters</span></div><select data-setting="mcVersion">${versionOptions()}</select></div><div class="settingrow"><div class="settingcopy"><strong>Mod loader</strong><span>Used for mod discovery and version queries</span></div><select data-setting="loader"><option value="fabric" ${sel('loader','fabric')}>Fabric</option><option value="forge" ${sel('loader','forge')}>Forge</option><option value="neoforge" ${sel('loader','neoforge')}>NeoForge</option><option value="quilt" ${sel('loader','quilt')}>Quilt</option></select></div><div class="settingrow"><div class="settingcopy"><strong>Memory allocation</strong><span>Saved preference; does not affect a game yet</span></div><select data-setting="memory"><option value="1024" ${sel('memory','1024')}>1 GB</option><option value="2048" ${sel('memory','2048')}>2 GB</option><option value="3072" ${sel('memory','3072')}>3 GB</option><option value="4096" ${sel('memory','4096')}>4 GB</option><option value="6144" ${sel('memory','6144')}>6 GB</option></select></div></section>
    <div class="sectionhead"><div><div class="eyebrow">LOCAL STORAGE</div><h2 style="margin-top:6px">Ember library</h2></div></div><section class="card"><div class="settingrow"><div class="settingcopy"><strong>Downloaded mod files</strong><span>Private app folder · .jar</span></div><span class="pill">${human(state.library.mods)}</span></div><div class="settingrow"><div class="settingcopy"><strong>Downloaded shader packs</strong><span>Private app folder · .zip</span></div><span class="pill">${human(state.library.shaders)}</span></div><p style="margin-top:12px">Android clears this private folder when the app is uninstalled. This build has no export or game-folder integration yet.</p></section>
    <div class="sectionhead"><div><div class="eyebrow">ABOUT</div><h2 style="margin-top:6px">Ember Launcher</h2></div><span class="pill">v${safe(state.version||'0.1.0')}</span></div><section class="card"><h3>Current build</h3><p>Modrinth discovery + app-private downloads, Microsoft device-code authentication scaffold, Ely.by authentication, Offline profiles and control-layout preview.</p><div class="separator"></div><p>Not implemented yet: game/runtime bundling, actual Play, shader rendering, mod injection, live touch input, modpack import/export and update management.</p><div class="formactions"><button class="quiet" data-action="open-modrinth">Modrinth ↗</button><button class="quiet" data-action="open-project">Create GitHub repo ↗</button></div></section>
    <div class="footer-note">EMBER IS NOT AFFILIATED WITH MOJANG, MICROSOFT, ELY.BY OR MODRINTH</div>`;}
  function render(){const root=$('#main');switch(state.tab){case'mods':root.innerHTML=renderCatalog('mod');break;case'shaders':root.innerHTML=renderCatalog('shader');break;case'accounts':root.innerHTML=renderAccounts();break;case'controls':root.innerHTML=renderControls();break;case'settings':root.innerHTML=renderSettings();break;default:root.innerHTML=renderHome();}
    if(state.tab==='mods'||state.tab==='shaders')wireCatalogSearch();
  }
  function wireCatalogSearch(){const form=$('.main form[data-form="search"]');if(!form)return;form.addEventListener('submit',e=>{e.preventDefault();const kind=form.dataset.kind;const q=$('#catalogQuery').value.trim();state.catalog[kind].query=q;state.catalog[kind].loading=true;state.catalog[kind].results=[];render();runSearch(kind,q);});}
  function runSearch(kind,q){if(!native()){state.catalog[kind].loading=false;render();toast('Open this project in the Android app to use the native Modrinth API bridge.',true);return;}Ember.searchModrinth(q,kind,state.settings.mcVersion||'1.21.1',state.settings.loader||'fabric');}
  function openModal(html){$('#modalHost').innerHTML=`<div class="modalback" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`;}
  function closeModal(){$('#modalHost').innerHTML='';}
  function showAuthCode(p){openModal(`<div class="eyebrow">MICROSOFT / DEVICE SIGN-IN</div><h2>Finish signing in</h2><p>${safe(p.message||'Open the Microsoft verification page and enter this code.')}</p><div class="codebox">${safe(p.userCode||'')}</div><p class="small">Leave Ember open while Microsoft verifies the account. The code expires after a short time.</p><div class="formactions"><button class="primary" data-action="open-verification" data-url="${safe(p.verificationUri||'https://microsoft.com/devicelogin')}">Open verification page ↗</button><button class="quiet" data-action="close-modal">Close</button></div><div id="authWait" class="notice" style="margin-top:13px">Waiting for authentication…</div>`);}
  function action(button){const act=button.dataset.action;switch(act){
    case'go-accounts':setTab('accounts');break;
    case'play':toast('Minecraft runtime is not bundled yet, so game launch is disabled.',true);break;
    case'open-ms-docs':if(native())Ember.openExternal('https://learn.microsoft.com/en-us/entra/identity-platform/quickstart-mobile-app-sign-in');break;
    case'open-ely-docs':if(native())Ember.openExternal('https://docs.ely.by/en/minecraft-auth.html');break;
    case'open-modrinth':if(native())Ember.openExternal('https://modrinth.com');break;
    case'open-project':if(native())Ember.openExternal('https://github.com/new');else toast('Open GitHub in a browser to create your repository.');break;
    case'offline-login':{const name=$('#offlineName')?.value||'';if(native())Ember.saveOfflineProfile(name);else toast('Offline profiles can be saved from the Android app.',true);break;}
    case'microsoft-login':{const id=$('#msClientId')?.value.trim()||'';state.settings.msClientId=id;persist('msClientId',id);if(native()){state.authBusy=true;toast('Starting Microsoft sign-in…');Ember.beginMicrosoftLogin(id);}else toast('Microsoft authentication needs the native Android bridge.',true);break;}
    case'ely-login':{const user=$('#elyUsername')?.value||'',pass=$('#elyPassword')?.value||'';if(native()){state.authBusy=true;Ember.loginElyBy(user,pass);}else toast('Ely.by authentication needs the native Android bridge.',true);break;}
    case'install':{if(!native()){toast('Download needs the native Android app.',true);break;}if(state.downloadBusy)break;state.downloadBusy=true;toast('Finding a compatible file…');Ember.installModrinth(button.dataset.id,button.dataset.kind,state.settings.mcVersion||'1.21.1',state.settings.loader||'fabric');break;}
    case'save-quick':document.querySelectorAll('[data-setting]').forEach(el=>{persist(el.dataset.setting,el.value);});toast('Preferences saved. They currently affect discovery and UI only.');break;
    case'save-touch':persist('touchScale',$('#touchScale')?.value||'100');toast('Touch layout preference saved (preview only).');break;
    case'preview-key':toast('HUD preview only — no Minecraft input runtime is connected yet.');break;
    case'open-verification':if(native())Ember.openExternal(button.dataset.url||'https://microsoft.com/devicelogin');break;
    case'close-modal':closeModal();break;
  }}
  document.addEventListener('click',e=>{
    const tab=e.target.closest('[data-tab]');if(tab){e.preventDefault();setTab(tab.dataset.tab);return;}
    const b=e.target.closest('[data-action]');if(b){if(b.dataset.action==='close-modal' && !b.classList.contains('modalback') && b.closest('.modal')){action(b);return;}if(b.dataset.action==='close-modal' && b.classList.contains('modalback') && e.target!==b)return;action(b);}
  });
  document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-setting]')){persist(el.dataset.setting,el.value);if(el.dataset.setting==='touchScale'&&$('#scaleDisplay'))$('#scaleDisplay').textContent=el.value+'%';if((el.dataset.setting==='mcVersion'||el.dataset.setting==='loader')&&(state.tab==='mods'||state.tab==='shaders')){const k=state.tab==='shaders'?'shader':'mod';state.catalog[k].results=[];state.catalog[k].loading=false;render();}}});
  document.addEventListener('input',e=>{if(e.target.id==='touchScale'&&$('#scaleDisplay'))$('#scaleDisplay').textContent=e.target.value+'%';});
  window.onNativeEvent = function(raw){let eventObj;try{eventObj=typeof raw==='string'?JSON.parse(raw):raw;}catch(_){return;}const p=eventObj.payload||{};switch(eventObj.type){
    case'catalog-loading':state.catalog[p.kind].loading=true;state.catalog[p.kind].results=[];if(state.tab===(p.kind==='shader'?'shaders':'mods'))render();break;
    case'catalog-results':state.catalog[p.kind].loading=false;state.catalog[p.kind].results=p.results||[];if(state.tab===(p.kind==='shader'?'shaders':'mods'))render();break;
    case'catalog-error':state.catalog[p.kind].loading=false;state.catalog[p.kind].results=[];render();toast(p.message||'Modrinth request failed.',true);break;
    case'download-started':state.downloadBusy=true;toast('Downloading from Modrinth…');break;
    case'download-result':state.downloadBusy=false;if(p.library)state.library=p.library;render();toast(p.message||'Download finished.',!p.success);break;
    case'microsoft-code':showAuthCode(p);break;
    case'auth-progress':state.authBusy=true;toast(p.message||'Signing in…');const wait=$('#authWait');if(wait)wait.textContent=p.message||'Waiting for authentication…';break;
    case'auth-success':state.authBusy=false;closeModal();updateProfile({name:p.name,uuid:p.uuid,provider:p.provider});render();toast(`${p.provider} profile connected: ${p.name}`);break;
    case'auth-error':state.authBusy=false;closeModal();render();toast(`${p.provider||'Sign-in'}: ${p.message||'Authentication failed.'}`,true);break;
    case'notice':toast(p.message||'');break;
  }};
  function init(){if(native()){try{const data=JSON.parse(Ember.getStartupData());state.version=data.version||'0.1.0';state.profile=data.profile&&data.profile!=='null'?data.profile:null;state.settings={...state.settings,...(data.settings||{})};state.library=data.library||state.library;}catch(_){state.version='0.1.0';}}else{state.version='0.1.0';}
    updateProfile(state.profile);render();
  }
  // Small keyboard-friendly fallback for desktop preview; network/actions require Android.
  init();
})();
</script>
</body>
</html>
